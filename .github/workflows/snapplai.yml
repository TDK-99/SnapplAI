# ============================================================
# SnapplAI — Automated Job Alerts
# ============================================================
# Fork this repo, add your secrets, edit your search settings in
# your_cv_config/file_config.env, then enable Actions in your fork. Done.
# ============================================================

name: SnapplAI — Job Alerts

# --- WHEN does it run? ---
on:
  # schedule:
  #   - cron: "0 9-18/3 * * *" # Every 3 hours: 09:00, 12:00, 15:00, 18:00 UTC
  workflow_dispatch:
           # Manual run from Actions tab

jobs:
  run-snapplai:
    runs-on: ubuntu-latest
    environment: snapplai

    steps:
      # 1. Get the code (this also fetches your_cv_config/file_config.env,
      #    which main.py loads automatically - edit your search settings
      #    there, not in this file)
      - name: Checkout repo
        uses: actions/checkout@v4

      # 2. Setup Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 3. Install dependencies
      - name: Install dependencies
        run: pip install -r requirements.txt

      # 4. Run the pipeline
      - name: Run SnapplAI
        env:
          LLM_GEMINI: ${{ secrets.LLM_GEMINI }} #token for Gemini API, you can get it from google ai studio
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }} #Generate a Gmail App Password: Google Account → Security → 2-Step Verification → App Passwords
        run: python main.py
